<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 大观园</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <style>
        .home-content {
            max-width: 1120px;
            margin: 0 auto;
            padding: var(--spacing-2xl);
        }
        
        .home-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }
        
        .continue-section {
            background: var(--brand-orange);
            border-radius: var(--radius-feature);
            padding: var(--spacing-3xl);
            color: var(--text-on-brand);
            position: relative;
            overflow: hidden;
        }
        
        .brand-decoration {
            position: absolute;
            top: 24px;
            right: 24px;
            opacity: 0.15;
            font-size: 120px;
            font-weight: 700;
            line-height: 1;
            user-select: none;
        }
        
        .continue-label {
            font-size: 14px;
            line-height: 22px;
            font-weight: 600;
            margin-bottom: var(--spacing-m);
            opacity: 0.9;
        }
        
        .continue-title {
            font-size: 30px;
            line-height: 40px;
            font-weight: 700;
            margin-bottom: var(--spacing-l);
        }
        
        .continue-meta {
            font-size: 14px;
            line-height: 22px;
            margin-bottom: var(--spacing-2xl);
            opacity: 0.85;
        }
        
        .btn-continue {
            background: #202124;
            color: #FFFFFF;
            padding: 12px 32px;
            font-size: 16px;
        }
        
        .btn-continue:hover {
            background: #303134;
        }
        
        .review-section {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-l);
        }
        
        .review-card {
            background: var(--bg-surface);
            border-radius: var(--radius-panel);
            padding: var(--spacing-xl);
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-l);
        }
        
        .review-title {
            font-size: 18px;
            line-height: 28px;
            font-weight: 600;
        }
        
        .review-count {
            background: var(--brand-light-bg);
            color: var(--brand-text-on-white);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .review-items {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-s);
        }
        
        .review-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-s) var(--spacing-m);
            border-radius: 8px;
            cursor: pointer;
            transition: background 120ms ease;
        }
        
        .review-item:hover {
            background: var(--bg-nav);
        }
        
        .review-item-label {
            font-size: 14px;
            line-height: 22px;
            color: var(--text-primary);
        }
        
        .review-item-count {
            font-size: 13px;
            line-height: 20px;
            color: var(--text-secondary);
        }
        
        .section-title {
            font-size: 20px;
            line-height: 30px;
            font-weight: 600;
            margin-bottom: var(--spacing-l);
        }
        
        .recent-list {
            background: var(--bg-surface);
            border-radius: var(--radius-panel);
            overflow: hidden;
        }
        
        .recent-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-l);
            padding: var(--spacing-l) var(--spacing-xl);
            border-bottom: 1px solid var(--border-default);
            cursor: pointer;
            transition: background 120ms ease;
        }
        
        .recent-item:last-child {
            border-bottom: none;
        }
        
        .recent-item:hover {
            background: var(--bg-nav);
        }
        
        .recent-time {
            font-size: 13px;
            line-height: 20px;
            color: var(--text-secondary);
            width: 120px;
            flex-shrink: 0;
        }
        
        .recent-content {
            flex: 1;
        }
        
        .recent-chapter {
            font-size: 14px;
            line-height: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .recent-progress {
            font-size: 13px;
            line-height: 20px;
            color: var(--text-secondary);
        }
        
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-l);
            margin-top: var(--spacing-2xl);
        }
        
        .subject-card {
            background: var(--bg-surface);
            border-radius: var(--radius-panel);
            padding: var(--spacing-xl);
            cursor: pointer;
            transition: all 120ms ease;
            border: 2px solid transparent;
        }
        
        .subject-card:hover {
            border-color: var(--brand-orange);
            transform: translateY(-2px);
        }
        
        .subject-icon {
            width: 40px;
            height: 40px;
            background: var(--brand-light-bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-m);
            font-size: 20px;
        }
        
        .subject-name {
            font-size: 16px;
            line-height: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .subject-count {
            font-size: 13px;
            line-height: 20px;
            color: var(--text-secondary);
        }
        
        @media (max-width: 1023px) {
            .home-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 767px) {
            .home-content {
                padding: var(--spacing-l);
            }
            
            .continue-section {
                padding: var(--spacing-xl);
            }
            
            .subjects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶栏 -->
        <div class="app-topbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 32px; height: 32px; background: var(--brand-orange); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #202124; font-weight: 700; font-size: 16px;">( )</div>
                <span style="font-size: 16px; font-weight: 600;">大观园</span>
            </div>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 16px;">
                <button class="btn btn-icon btn-text" title="搜索">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                </button>
                <button class="btn btn-icon btn-text" title="设置">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v10M1 12h6m6 0h10"/></svg>
                </button>
            </div>
        </div>
        
        <div class="app-body">
            <!-- 导航 -->
            <nav class="app-nav">
                <a href="home.html" class="nav-item active">
                    <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    <span>学习</span>
                </a>
                <a href="library.html" class="nav-item">
                    <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    <span>题库</span>
                </a>
                <a href="#" class="nav-item">
                    <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span>复习</span>
                </a>
                <a href="#" class="nav-item">
                    <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    <span>笔记</span>
                </a>
                <a href="#" class="nav-item">
                    <svg class="icon nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span>学习记录</span>
                </a>
                <a href="#" class="nav-item">
                    <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    <span>工具</span>
                </a>
                <a href="#" class="nav-item">
                    <svg class="icon nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v10M1 12h6m6 0h10"/></svg>
                    <span>设置</span>
                </a>
            </nav>
            
            <!-- 主内容 -->
            <main class="app-main">
                <div class="home-content">
                    <div class="home-grid">
                        <!-- 继续学习区 -->
                        <div class="continue-section">
                            <div class="brand-decoration">( )</div>
                            <div class="continue-label">继续学习</div>
                            <div class="continue-title">线性代数 · 二次型</div>
                            <div class="continue-meta">
                                第 8 题，共 24 题 · 已完成 29%
                            </div>
                            <button class="btn btn-continue">继续做题</button>
                        </div>
                        
                        <!-- 复习摘要 -->
                        <div class="review-section">
                            <div class="review-card">
                                <div class="review-header">
                                    <span class="review-title">复习摘要</span>
                                </div>
                                <div class="review-items">
                                    <div class="review-item">
                                        <span class="review-item-label">易错题</span>
                                        <span class="review-item-count">12 题</span>
                                    </div>
                                    <div class="review-item">
                                        <span class="review-item-label">收藏</span>
                                        <span class="review-item-count">8 题</span>
                                    </div>
                                    <div class="review-item">
                                        <span class="review-item-label">未掌握</span>
                                        <span class="review-item-count">23 题</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 最近学习 -->
                    <div class="section-title">最近学习</div>
                    <div class="recent-list">
                        <div class="recent-item">
                            <div class="recent-time">今天 14:32</div>
                            <div class="recent-content">
                                <div class="recent-chapter">线性代数 · 二次型 · 可逆变换求变换矩阵</div>
                                <div class="recent-progress">做题 8/24</div>
                            </div>
                        </div>
                        <div class="recent-item">
                            <div class="recent-time">昨天 16:45</div>
                            <div class="recent-content">
                                <div class="recent-chapter">高等数学 · 一元微分 · 导数应用</div>
                                <div class="recent-progress">做题 15/32</div>
                            </div>
                        </div>
                        <div class="recent-item">
                            <div class="recent-time">11月24日</div>
                            <div class="recent-content">
                                <div class="recent-chapter">概率统计 · 随机变量 · 分布函数</div>
                                <div class="recent-progress">做题 20/20 · 已完成</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 科目入口 -->
                    <div class="subjects-grid">
                        <div class="subject-card">
                            <div class="subject-icon">∫</div>
                            <div class="subject-name">高等数学</div>
                            <div class="subject-count">3703 题</div>
                        </div>
                        <div class="subject-card">
                            <div class="subject-icon">A</div>
                            <div class="subject-name">线性代数</div>
                            <div class="subject-count">1842 题</div>
                        </div>
                        <div class="subject-card">
                            <div class="subject-icon">P</div>
                            <div class="subject-name">概率统计</div>
                            <div class="subject-count">1256 题</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- 状态栏 -->
        <div class="app-statusbar">
            <span>演示数据 · 阶段 1 视觉样板</span>
            <span style="margin-left: auto;">离线可用</span>
        </div>
    </div>
</body>
</html>
