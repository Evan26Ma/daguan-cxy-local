<!DOCTYPE html>
<html lang="zh-CN" data-app-version="new">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习空间 · 本地大观园</title>
  <meta name="description" content="非官方本地数学学习空间：章节练习、错题复习与个人学习记录。" />
  <meta name="theme-color" content="#FF6A1A" />
  <link rel="icon" type="image/svg+xml" href="./assets/landing/local-mark.svg" />
  <link rel="stylesheet" href="./design-tokens.css?v=2" />
  <link rel="stylesheet" href="./vendor/katex.min.css" />
  <link rel="stylesheet" href="./styles-new.css?v=90" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script src="./ui-version.js?v=90"></script>
  <script>
    // 版本检查和主题初始化
    (() => {
      // 清理缓存
      if (location.search.includes("purge=1")) {
        navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
        caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
        if (!localStorage.getItem("daguan_purged")) {
          localStorage.setItem("daguan_purged", "1");
          location.replace(location.pathname + "?fresh=1");
        }
      }

      // 检查版本偏好
      const versionPref = localStorage.getItem('daguan_version_preference');
      const urlParams = new URLSearchParams(window.location.search);
      const uiParam = urlParams.get('ui');

      if (uiParam === 'old' || (versionPref === 'old' && !uiParam)) {
        window.location.href = './legacy.html' + window.location.search;
        return;
      }

      // 应用主题
      try {
        const appearance = JSON.parse(localStorage.getItem('daguan_ui_appearance_new') || '{}');
        document.documentElement.dataset.theme = appearance.theme || 'light';
        if (appearance.reduceMotion) {
          document.documentElement.dataset.reduceMotion = 'true';
        }
      } catch {
        document.documentElement.dataset.theme = 'light';
      }

      document.documentElement.dataset.uiVersion = "new";
    })();
  </script>
</head>
<body>
  <div class="app-container" id="app">
    <!-- 顶栏 -->
    <header class="app-topbar">
      <button type="button" class="btn btn-icon" id="btn-toggle-nav" aria-label="切换导航" onclick="App.toggleNav()">
        <svg class="icon nav-icon" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <a href="#" class="brand" onclick="App.showHome(); return false;">
        <img class="brand-mark" src="./assets/landing/local-mark.svg" alt="大观园" width="34" height="34" />
        <span class="brand-copy">
          <strong>本地大观园</strong>
          <small>LOCAL DAGUAN</small>
        </span>
      </a>

      <div class="topbar-actions">
        <button type="button" class="btn btn-icon" id="btn-settings" title="设置" onclick="App.showSettings()">
          <svg class="icon nav-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v10M5.6 5.6l4.2 4.2m4.2 4.2l4.2 4.2M1 12h6m6 0h10M5.6 18.4l4.2-4.2m4.2-4.2l4.2-4.2"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <!-- 侧边导航 -->
      <nav class="app-nav" id="app-nav">
        <div class="nav-list">
          <button type="button" class="nav-item active" data-view="home" onclick="App.navigate('home')">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/>
              <path d="M9 22V12h6v10"/>
            </svg>
            <span class="nav-text">首页</span>
          </button>

          <button type="button" class="nav-item" data-view="library" onclick="App.navigate('library')">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span class="nav-text">题库</span>
          </button>

          <button type="button" class="nav-item" data-view="settings" onclick="App.navigate('settings')">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v6m0 6v10M5.6 5.6l4.2 4.2m4.2 4.2l4.2 4.2M1 12h6m6 0h10M5.6 18.4l4.2-4.2m4.2-4.2l4.2-4.2"/>
            </svg>
            <span class="nav-text">设置</span>
          </button>
        </div>
      </nav>

      <!-- 主内容区 -->
      <main class="app-main" id="app-main">
        <div class="home-content">
          <h1>加载中...</h1>
        </div>
      </main>
    </div>

    <!-- 状态栏 -->
    <footer class="app-statusbar">
      <span id="status-text">就绪</span>
      <span id="status-info"></span>
    </footer>
  </div>

  <!-- 导航遮罩 -->
  <div class="nav-overlay" id="nav-overlay" onclick="App.toggleNav()"></div>

  <!-- KaTeX 和应用脚本 -->
  <script defer src="./vendor/katex.min.js"></script>
  <script defer src="./app-new.js?v=90"></script>
</body>
</html>
