<!DOCTYPE html>
<html lang="zh-CN" data-app-version="new">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习空间 · 本地大观园</title>
  <meta name="description" content="非官方本地数学学习空间：章节练习、错题复习与个人学习记录。" />
  <meta name="theme-color" content="#C83F32" />
  <link rel="icon" type="image/svg+xml" href="./assets/math-mark.svg" />
  <link rel="stylesheet" href="./design-tokens.css?v=3" />
  <link rel="stylesheet" href="./vendor/katex.min.css" />
  <link rel="stylesheet" href="./styles-new.css?v=110" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script src="./ui-version.js?v=106"></script>
  <script>
    // 版本检查和主题初始化
    (() => {
      // 清理缓存
      if (location.search.includes("purge=1")) {
        navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
        caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
        if (!localStorage.getItem("daguan_purged")) {
          localStorage.setItem("daguan_purged", "1");
          location.replace(location.pathname + "?fresh=1");
        }
      }

      // 版本偏好：统一走 ui-version.js 的选择键（daguan_ui_version_v1）
      const urlParams = new URLSearchParams(window.location.search);
      const uiParam = urlParams.get('ui');
      const pref = (window.DaguanVersions && DaguanVersions.selected(localStorage)) || 'new';

      if (uiParam === 'old' || (pref === 'old' && !uiParam)) {
        window.location.replace('./legacy.html' + window.location.search);
        return;
      }
      if (uiParam === 'new') {
        try { localStorage.setItem('daguan_ui_version_v1', 'new'); } catch {}
      }

      // 应用主题（外观键由 ui-version.js 统一管理）
      try {
        const appearance = JSON.parse(localStorage.getItem((window.DaguanVersions && DaguanVersions.appearanceKey) || 'daguan_ui_appearance_new_v1') || '{}');
        document.documentElement.dataset.theme = appearance.theme || 'light';
        if (appearance.reduceMotion) {
          document.documentElement.dataset.reduceMotion = 'true';
        }
      } catch {
        document.documentElement.dataset.theme = 'light';
      }

      document.documentElement.dataset.uiVersion = "new";
    })();
  </script>
</head>
<body>
  <div class="app-container" id="app">
    <!-- 顶栏 -->
    <header class="app-topbar">
      <button type="button" class="btn btn-icon" id="btn-toggle-nav" aria-label="打开导航" aria-controls="app-nav" aria-expanded="false" onclick="App.toggleNav()">
        <svg class="icon nav-icon" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <a href="#" class="brand" onclick="App.showHome(); return false;">
        <svg class="brand-mark" viewBox="0 0 34 34" role="img" aria-label="大观园数学标记">
          <rect width="34" height="34" rx="8" fill="var(--brand-orange)" />
          <path d="M10 7H7v20h3M24 7h3v20h-3" fill="none" stroke="var(--text-on-brand)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="m10 22 5-5 4 3 5-8" fill="none" stroke="var(--text-on-brand)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-copy">
          <strong>大观园</strong>
          <small>数学学习空间</small>
        </span>
      </a>

      <button type="button" class="btn btn-secondary topbar-search-trigger" id="btn-global-search" onclick="App.openGlobalSearch()" aria-label="全库搜索">⌕ <span>搜索题目</span><kbd>/</kbd></button>
      <button type="button" class="btn btn-text topbar-help-trigger" onclick="App.showShortcutHelp()" aria-label="快捷键帮助">快捷键 <kbd>?</kbd></button>

    </header>

    <div class="app-body">
      <nav class="app-nav sidebar-nav" id="app-nav" aria-label="主导航">
        <div class="nav-section-label">学习空间</div>
        <div class="nav-list">
          <button type="button" class="nav-item active" data-view="home">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/>
              <path d="M9 22V12h6v10"/>
            </svg>
            <span class="nav-text">学习</span>
          </button>

          <button type="button" class="nav-item" data-view="library">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span class="nav-text">题库</span>
          </button>

          <button type="button" class="nav-item" data-view="review">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            <span class="nav-text">复习</span>
          </button>

          <button type="button" class="nav-item" data-view="notes">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
              <path d="M14 2v6h6"/>
              <path d="M16 13H8M16 17H8M10 9H8"/>
            </svg>
            <span class="nav-text">笔记</span>
          </button>

          <button type="button" class="nav-item" data-view="records">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M12 20V10"/>
              <path d="M18 20V4"/>
              <path d="M6 20v-4"/>
            </svg>

          <button type="button" class="nav-item" data-view="tools">
            <svg class="nav-icon" viewBox="0 0 24 24">

            </svg>
            <span class="nav-text">工具</span>
          </button>

          <button type="button" class="nav-item" data-view="settings">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v6m0 6v10M5.6 5.6l4.2 4.2m4.2 4.2l4.2 4.2M1 12h6m6 0h10M5.6 18.4l4.2-4.2m4.2-4.2l4.2-4.2"/>
            </svg>
            <span class="nav-text">设置</span>
          </button>
        </div>
        <div class="nav-utilities">
          <button type="button" class="nav-utility-button" onclick="App.openGlobalSearch()" aria-label="搜索题目，快捷键斜杠">
            <span>搜索题目</span><kbd>/</kbd>
          </button>
          <button type="button" class="nav-utility-button" onclick="App.showShortcutHelp()" aria-label="快捷键帮助，快捷键问号">
            <span>快捷键帮助</span><kbd>?</kbd>
          </button>
        </div>
      </nav>
      <!-- 主内容区 -->
      <main class="app-main" id="app-main">
        <div class="home-content">
          <h1>加载中...</h1>
        </div>
      </main>
    </div>

    <!-- 状态栏 -->
    <footer class="app-statusbar">
      <span id="status-text">就绪</span>
      <span id="status-info"></span>
    </footer>
  </div>

  <!-- 导航遮罩 -->
  <div class="nav-overlay" id="nav-overlay" onclick="App.toggleNav()"></div>

  <!-- 预览模式横幅与解锁对话框 -->
  <div class="preview-banner" id="preview-banner" hidden>
    <span>只读预览模式：收藏、掌握、批注、AI 与同步需要解锁。</span>
    <button type="button" class="btn btn-secondary btn-sm" onclick="PreviewAccess.openUnlockDialog()">解锁</button>
  </div>
  <dialog class="preview-dialog" id="dlg-preview-access">
    <form method="dialog" style="display: contents;">
      <h3>输入访问 Token</h3>
      <p class="text-helper" id="preview-access-feedback">输入访问 Token 后即可使用收藏、错题、批注和同步。</p>
      <input type="password" id="preview-access-key" autocomplete="off" placeholder="访问 Token" />
      <div class="tool-controls">
        <button type="button" class="btn btn-primary" onclick="PreviewAccess.unlock(event)">解锁个人功能</button>
        <button type="button" class="btn btn-text" onclick="document.getElementById('dlg-preview-access').close()">稍后再说</button>
      </div>
    </form>
  </dialog>

  <!-- KaTeX 和应用脚本 -->
  <script defer src="./vendor/marked.min.js"></script>
  <script defer src="./vendor/katex.min.js"></script>
  <script defer src="./app-new.js?v=110"></script>
</body>
</html>
