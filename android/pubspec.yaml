name: daguan_math
description: 大观园数学题库 Android 离线平板版
publish_to: "none"
version: 1.1.6+17

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PreviewChinese
      fonts:
        - asset: test/preview_font.ttf
  assets:
    - assets/questions.json
    - assets/categories.json
    - assets/initial_progress.json
    - assets/question_images/
