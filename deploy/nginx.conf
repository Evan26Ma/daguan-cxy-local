server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional sub-path deployment: https://host/daguan-math/
    location = /daguan-math {
        return 301 /daguan-math/;
    }

    location ^~ /daguan-math/ {
        add_header Cache-Control "public, max-age=3600";
        rewrite ^/daguan-math/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|json|png|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
