name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows release package
        run: npm run package:windows:release

      - name: Run tests
        run: npm test

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DaguanMath-windows-x64.exe
            dist/DaguanMath-windows-x64.exe.sha256
            dist/DaguanMath-windows-x64.zip
            dist/DaguanMath-windows-x64.zip.sha256
